<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Render check</title>
  <style>
    body { margin: 0; padding: 16px; background: #111; color: #d7dce6; font: 13px/1.5 Consolas, monospace; }
    #log { margin: 0; white-space: pre-wrap; }
  </style>
</head>
<body>
<pre id="log">running...</pre>
<script type="module">
/**
 * 浏览器侧的自检页面：验证「轮廓 → Path2D → clip → canvas 像素」这条链路。
 * 几何测试只证明轮廓算得对，这里证明画出来的像素确实和轮廓一致。
 *
 * 用法：起本地服务后打开 /test/render-check.html，屏幕上直接出 PASS / FAIL。
 */

import { createPuzzle } from '../js/cuts.js';
import { createPiece, makeDraggable } from '../js/piece.js';
import { createDownloadButton, createStats, renderPicker, setPreview } from '../js/ui.js';

const ROWS = 3;
const COLUMNS = 4;
const BOARD_W = 1000;
const BOARD_H = 600;
const SEED = 99;
const SAMPLE_STEP = 5;
// 离轮廓线不到这么多像素的点不判定，抗锯齿会让边缘像素模棱两可
const EDGE_TOLERANCE = 2;
const COLOR_TOLERANCE = 16;

const log = document.getElementById('log');
const lines = [];
let failures = 0;

function check(name, ok, detail = '') {
  lines.push(`${ok ? 'PASS' : 'FAIL'}  ${name}${detail ? `  -- ${detail}` : ''}`);
  if (!ok) failures += 1;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error(`cannot load ${src}`));
    image.src = src;
  });
}

function contains(polygon, point) {
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const a = polygon[i];
    const b = polygon[j];
    if ((a.y > point.y) !== (b.y > point.y)
      && point.x < ((b.x - a.x) * (point.y - a.y)) / (b.y - a.y) + a.x) {
      inside = !inside;
    }
  }
  return inside;
}

function distanceToOutline(polygon, point) {
  let best = Infinity;
  for (let i = 0; i < polygon.length; i++) {
    const a = polygon[i];
    const b = polygon[(i + 1) % polygon.length];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const lengthSq = dx * dx + dy * dy;
    const t = lengthSq === 0
      ? 0
      : Math.max(0, Math.min(1, ((point.x - a.x) * dx + (point.y - a.y) * dy) / lengthSq));
    best = Math.min(best, Math.hypot(point.x - (a.x + dx * t), point.y - (a.y + dy * t)));
  }
  return best;
}

/** 用其中一条内部边上的点，确认相邻两块的凹凸是互补的。 */
function neighbourPairs(grid) {
  const pairs = [];
  for (let r = 0; r < ROWS - 1; r++) {
    for (let c = 0; c < COLUMNS; c++) {
      pairs.push([grid.pieces[r * COLUMNS + c], grid.pieces[(r + 1) * COLUMNS + c]]);
    }
  }
  return pairs;
}

async function main() {
  const image = await loadImage('../images/sample-a.png');
  const grid = createPuzzle({ rows: ROWS, columns: COLUMNS, width: BOARD_W, height: BOARD_H, seed: SEED });
  const dpr = window.devicePixelRatio || 1;

  const sourceCanvas = document.createElement('canvas');
  sourceCanvas.width = image.naturalWidth;
  sourceCanvas.height = image.naturalHeight;
  const sourceCtx = sourceCanvas.getContext('2d');
  sourceCtx.drawImage(image, 0, 0);

  const built = grid.pieces.map((piece) => ({
    piece,
    ...createPiece({
      piece,
      image,
      board: { width: BOARD_W, height: BOARD_H },
      cellW: grid.cellW,
      cellH: grid.cellH,
      tabHeight: grid.tabHeight,
      highlighted: false,
    }),
  }));

  check('piece count matches the grid', built.length === ROWS * COLUMNS);
  check('every piece has a clip-path', built.every((item) => item.el.style.clipPath.includes('path(')));

  // 1) 画布像素必须和轮廓一致：轮廓内不透明，轮廓外透明
  let mismatches = 0;
  let samples = 0;
  for (const item of built) {
    const { el, pad, width, height } = item;
    const ctx = el.getContext('2d');
    const imageData = ctx.getImageData(0, 0, el.width, el.height).data;

    for (let x = 0; x < width; x += SAMPLE_STEP) {
      for (let y = 0; y < height; y += SAMPLE_STEP) {
        const boardPoint = {
          x: x - pad + item.piece.col * grid.cellW,
          y: y - pad + item.piece.row * grid.cellH,
        };
        if (distanceToOutline(item.piece.outline, boardPoint) <= EDGE_TOLERANCE) continue;

        const deviceX = Math.round(x * dpr);
        const deviceY = Math.round(y * dpr);
        const alpha = imageData[(deviceY * el.width + deviceX) * 4 + 3];
        const expected = contains(item.piece.outline, boardPoint);
        const actual = alpha > 0;
        samples += 1;
        if (expected !== actual) mismatches += 1;
      }
    }
  }
  check('canvas pixels agree with the outline', mismatches === 0,
    `${mismatches} mismatches over ${samples} samples`);

  // 2) 画布左上角一定在轮廓外，必须完全透明
  const opaqueCorners = built.filter((item) => {
    const data = item.el.getContext('2d').getImageData(1, 1, 1, 1).data;
    return data[3] !== 0;
  });
  check('canvas corners are fully transparent', opaqueCorners.length === 0,
    `${opaqueCorners.length} pieces have an opaque corner`);

  // 3) 每块正中间应该画到源图对应的位置
  let colorMisses = 0;
  for (const item of built) {
    const boardX = (item.piece.col + 0.5) * grid.cellW;
    const boardY = (item.piece.row + 0.5) * grid.cellH;
    const source = sourceCtx.getImageData(
      Math.round((boardX / BOARD_W) * image.naturalWidth),
      Math.round((boardY / BOARD_H) * image.naturalHeight),
      1, 1,
    ).data;
    const local = { x: Math.round((grid.cellW / 2 + item.pad) * dpr), y: Math.round((grid.cellH / 2 + item.pad) * dpr) };
    const drawn = item.el.getContext('2d').getImageData(local.x, local.y, 1, 1).data;
    const delta = Math.abs(source[0] - drawn[0]) + Math.abs(source[1] - drawn[1]) + Math.abs(source[2] - drawn[2]);
    if (delta > COLOR_TOLERANCE || drawn[3] !== 255) colorMisses += 1;
  }
  check('each piece shows its own part of the image', colorMisses === 0,
    `${colorMisses} pieces show the wrong content`);

  // 4) 相邻两块在交接处必须一凸一凹，而不是各凸各的
  let overlapPairs = 0;
  for (const [top, bottom] of neighbourPairs(grid)) {
    const boundary = (top.row + 1) * grid.cellH;
    const covers = (piece, point) => contains(piece.outline, point);
    for (let n = 1; n < 10; n++) {
      const point = { x: (top.col + n / 10) * grid.cellW, y: boundary };
      if (covers(top, { x: point.x, y: boundary - 0.01 }) && covers(bottom, { x: point.x, y: boundary + 0.01 })
        && covers(top, point) === covers(bottom, point)) {
        overlapPairs += 1;
      }
    }
  }
  check('no sample point is claimed by two pieces', overlapPairs === 0, `${overlapPairs} conflicts`);

  // 5) 高亮必须真的改变画面
  const plain = createPiece({
    piece: grid.pieces[0], image,
    board: { width: BOARD_W, height: BOARD_H },
    cellW: grid.cellW, cellH: grid.cellH, tabHeight: grid.tabHeight, highlighted: false,
  });
  const marked = createPiece({
    piece: grid.pieces[0], image,
    board: { width: BOARD_W, height: BOARD_H },
    cellW: grid.cellW, cellH: grid.cellH, tabHeight: grid.tabHeight, highlighted: true,
  });
  const sample = (canvasCtx) => {
    const d = canvasCtx.getImageData(Math.round((grid.cellW / 2 + plain.pad) * dpr), Math.round((grid.cellH / 2 + plain.pad) * dpr), 1, 1).data;
    return `${d[0]},${d[1]},${d[2]}`;
  };
  check('highlight changes the rendering', sample(plain.el.getContext('2d')) !== sample(marked.el.getContext('2d')),
    `${sample(plain.el.getContext('2d'))} vs ${sample(marked.el.getContext('2d'))}`);

  check('device pixel ratio is handled', built.every((item) => item.el.width === Math.round(item.width * dpr)),
    `dpr=${dpr}`);

  // 6) 顶栏那几个控件：点得动、数得准
  const picker = document.createElement('div');
  const picked = [];
  renderPicker(picker, [{ image: 'a.png' }, { image: 'b.png' }, { image: 'c.png' }], 1, (index) => picked.push(index));
  check('picker renders one button per puzzle', picker.children.length === 3, `${picker.children.length} buttons`);
  picker.children[2].dispatchEvent(new MouseEvent('click', { bubbles: true }));
  check('picker reports the clicked index', picked.length === 1 && picked[0] === 2, JSON.stringify(picked));
  check('picker marks only the active item', picker.children[1].classList.contains('is-active')
    && !picker.children[0].classList.contains('is-active'));

  const single = document.createElement('div');
  renderPicker(single, [{ image: 'a.png' }], 0, () => {});
  check('picker stays empty for a single puzzle', single.children.length === 0);

  const toggle = document.createElement('button');
  const boardStub = document.createElement('div');
  setPreview(toggle, boardStub, true);
  const onState = boardStub.classList.contains('board--preview')
    && toggle.textContent === 'Preview: On' && toggle.dataset.visible === 'true';
  setPreview(toggle, boardStub, false);
  const offState = !boardStub.classList.contains('board--preview')
    && toggle.textContent === 'Preview: Off' && toggle.dataset.visible === 'false';
  check('preview toggle switches both ways', onState && offState);

  const timer = document.createElement('span');
  const progress = document.createElement('span');
  const stats = createStats(timer, progress);
  stats.begin(3, 1);
  const initial = progress.textContent;
  const beforeDone = stats.placed();
  const atDone = stats.placed();
  stats.stop();
  check('stats start from the pre-placed piece', initial === '1 / 3', initial);
  check('stats flag completion on the last piece', beforeDone === false && atDone === true,
    progress.textContent);
  check('timer renders as mm:ss', /^\d{2}:\d{2}$/.test(timer.textContent), timer.textContent);

  // 7) 拖拽与吸附。合成的 pointer 事件没有真实指针，setPointerCapture 会抛异常，
  //    所以先把它换掉（只在这个小段里），这样就能把拖拽逻辑完整跑一遍。
  const proto = Element.prototype;
  const realCapture = proto.setPointerCapture;
  const realHas = proto.hasPointerCapture;
  const realRelease = proto.releasePointerCapture;
  proto.setPointerCapture = function () {};
  proto.hasPointerCapture = function () { return false; };
  proto.releasePointerCapture = function () {};

  try {
    const box = document.createElement('div');
    box.style.cssText = 'position:relative;width:600px;height:400px;overflow:hidden';
    document.body.append(box);

    const AREA = { width: 600, height: 400 };
    const makeDraggablePiece = (piece, host, start) => {
      const item = createPiece({
        piece, image, board: { width: BOARD_W, height: BOARD_H },
        cellW: grid.cellW, cellH: grid.cellH, tabHeight: grid.tabHeight, highlighted: false,
      });
      item.el.style.position = 'absolute';
      item.el.style.left = `${start.left}px`;
      item.el.style.top = `${start.top}px`;
      host.append(item.el);
      return item.el;
    };
    const drag = (el, fromX, fromY, dx, dy) => {
      const fire = (type, x, y) => el.dispatchEvent(new PointerEvent(type, {
        clientX: x, clientY: y, button: 0, buttons: 1, pointerId: 1, bubbles: true,
      }));
      fire('pointerdown', fromX, fromY);
      fire('pointermove', fromX + dx, fromY + dy);
      fire('pointerup', fromX + dx, fromY + dy);
    };

    // 7a) 停在离目标 10px 的位置 → 应该吸附归位并回调
    const target = { left: 300, top: 200 };
    const near = makeDraggablePiece(grid.pieces[0], box, { left: 10, top: 10 });
    let placeCalls = 0;
    makeDraggable(near, { target, snapDistance: 24, area: AREA, onPlace: () => { placeCalls += 1; } });
    drag(near, 50, 50, 280, 190);
    check('a drop inside snapDistance snaps home',
      parseFloat(near.style.left) === target.left
      && parseFloat(near.style.top) === target.top
      && placeCalls === 1
      && near.classList.contains('piece--placed'),
      `left=${near.style.left} top=${near.style.top} calls=${placeCalls}`);

    // 7b) 停在离目标 40px 的位置 → 不该吸附，位置保持不动
    const far = makeDraggablePiece(grid.pieces[1], box, { left: 10, top: 10 });
    let farCalls = 0;
    makeDraggable(far, { target, snapDistance: 24, area: AREA, onPlace: () => { farCalls += 1; } });
    drag(far, 50, 50, 250, 190);
    check('a drop outside snapDistance stays where it was dropped',
      parseFloat(far.style.left) === 260 && parseFloat(far.style.top) === 200
      && farCalls === 0 && !far.classList.contains('piece--placed'),
      `left=${far.style.left} top=${far.style.top} calls=${farCalls}`);

    // 7c) 往右下狂拖 → 必须被夹住，至少留一半在游玩区内
    const runaway = makeDraggablePiece(grid.pieces[2], box, { left: 10, top: 10 });
    makeDraggable(runaway, { target, snapDistance: 24, area: AREA, onPlace: () => {} });
    drag(runaway, 50, 50, 5000, 5000);
    const clampedLeft = AREA.width - runaway.offsetWidth / 2;
    const clampedTop = AREA.height - runaway.offsetHeight / 2;
    check('dragging past the edge is clamped to half a piece',
      parseFloat(runaway.style.left) === clampedLeft && parseFloat(runaway.style.top) === clampedTop,
      `left=${runaway.style.left} (want ${clampedLeft}) top=${runaway.style.top} (want ${clampedTop})`);

    // 7d) 已经归位的块不能再被拖走
    const beforeDrag = near.style.left;
    drag(near, 100, 100, 120, 120);
    check('a placed piece can no longer be dragged', near.style.left === beforeDrag, near.style.left);
  } finally {
    proto.setPointerCapture = realCapture;
    proto.hasPointerCapture = realHas;
    proto.releasePointerCapture = realRelease;
  }

  // 8) 下载按钮：拼完前禁用，点击时下载的必须是原始图片文件本身。
  //    注意「禁用按钮不会被点击」是浏览器自己的行为，这里只断言 disabled 属性，
  //    然后用合成 click 检查真正由我们控制的部分：链接指向哪里、文件名是什么。
  const downloadButton = document.createElement('button');
  const download = createDownloadButton(downloadButton, () => 'images/sample-a.png');
  check('download starts disabled', downloadButton.disabled === true, downloadButton.title);

  const anchors = [];
  const realAnchorClick = HTMLAnchorElement.prototype.click;
  HTMLAnchorElement.prototype.click = function () {
    anchors.push({ href: this.href, download: this.download });
  };
  try {
    download.setReady(true);
    check('download unlocks when the puzzle is solved', downloadButton.disabled === false, downloadButton.title);
    downloadButton.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    check('download targets the untouched original file',
      anchors.length === 1
      && anchors[0].href.endsWith('/images/sample-a.png')
      && anchors[0].download === 'sample-a.png',
      JSON.stringify(anchors));
    download.setReady(false);
    check('download locks again for a new round', downloadButton.disabled === true);
  } finally {
    HTMLAnchorElement.prototype.click = realAnchorClick;
  }
}

main()
  .catch((error) => check('uncaught error', false, String((error && error.stack) || error)))
  .finally(() => {
    log.textContent = `${failures === 0 ? 'ALL PASS' : `${failures} FAILED`}\n\n${lines.join('\n')}\n`;
    document.title = failures === 0 ? 'RENDER CHECK ALL PASS' : `RENDER CHECK ${failures} FAILED`;
  });
</script>
</body>
</html>
