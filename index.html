<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jigsaw Puzzle</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Jigsaw Puzzle</h1>
    <div class="picker" id="picker" role="group" aria-label="Choose a puzzle"></div>
    <div class="stats">
      <span class="stat" id="timer">00:00</span>
      <span class="stat" id="progress">0 / 0</span>
      <button type="button" id="preview-toggle" aria-pressed="false">Preview: Off</button>
      <button type="button" id="download" disabled>Download</button>
      <button type="button" id="restart">Restart</button>
    </div>
  </header>

  <main id="playfield">
    <div class="board" id="board">
      <img class="board__ghost" id="board-ghost" alt="">
    </div>
    <div class="banner" id="banner" hidden></div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
